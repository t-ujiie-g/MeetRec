[package]
name = "meetrec-mac"
description = "MeetRec の macOS 層（ScreenCaptureKit / VideoToolbox / CoreAudio / AppKit）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# クレート全体が macOS 専用（`#![cfg(target_os = "macos")]`）なので、依存もすべて macOS のときだけ。
[target.'cfg(target_os = "macos")'.dependencies]
meetrec-core.workspace = true
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSBundle", "NSDictionary", "NSError", "NSGeometry", "NSNotification", "NSObjCRuntime", "NSProcessInfo", "NSRunLoop", "NSString", "NSTimer", "NSURL", "NSValue", "NSDate", "NSEnumerator", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "libc", "objc2-core-foundation", "NSAlert", "NSApplication", "NSBezierPath", "NSButton", "NSButtonCell", "NSCell", "NSColor", "NSControl", "NSGraphics", "NSImage", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel", "NSResponder", "NSRunningApplication", "NSSavePanel", "NSScreen", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSTextField", "NSView", "NSWindow", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "objc2", "CFArray", "CFBase", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "objc2", "bitflags", "CGWindow", "CGWindowLevel"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "objc2", "bitflags", "objc2-core-audio-types", "objc2-core-video", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "objc2", "CVBuffer", "CVImageBuffer", "CVPixelBuffer"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-core-audio-types", "AudioHardware"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "objc2", "CoreAudioBaseTypes"] }
objc2-audio-toolbox = { version = "0.3", default-features = false, features = ["std", "objc2-core-audio-types", "AudioConverter"] }
objc2-video-toolbox = { version = "0.3", default-features = false, features = ["std", "objc2", "bitflags", "objc2-core-media", "objc2-core-video", "VTCompressionProperties", "VTCompressionSession", "VTErrors", "VTSession"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "block2", "dispatch2", "libc", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media", "SCShareableContent", "SCStream"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNUserNotificationCenter", "UNNotificationTrigger"] }
