[package]
name = "meetrec-mac"
description = "MeetRec の macOS 層（ScreenCaptureKit / VideoToolbox / CoreAudio / AppKit）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
meetrec-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-audio-toolbox = "0.3"
objc2-video-toolbox = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-av-foundation = "0.3"
objc2-service-management = "0.3"
objc2-user-notifications = "0.3"
