# Windows の音の録り方を確かめる検証用ツール（MeetRec 本体には入らない。docs/windows-teams-audio.md）。
# ワークスペースの外に置く（下の空の [workspace]）ので、本体のビルド・CI・Cargo.lock には影響しない。
[package]
name = "lbtest"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
]

# `#[implement]` マクロが生成するコードが `windows_core` を直接参照するため必要（windows と同系列）。
[dependencies.windows-core]
version = "0.62"

[workspace]
