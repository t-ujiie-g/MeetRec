name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ソースを読んでビルドするだけなので、トークンの権限は読み取りのみにする。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # OS 非依存ロジック（検出・muxer・ミキサ等）のテスト。最も速く結果が出る。
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 版・コンポーネント・ターゲットは rust-toolchain.toml に従う。
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # 版・コンポーネント・ターゲットは rust-toolchain.toml に従う。
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p meetrec --target aarch64-apple-darwin
          cargo build --release -p meetrec --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/meetrec \
            target/aarch64-apple-darwin/release/meetrec \
            target/x86_64-apple-darwin/release/meetrec
          packaging/macos/bundle.sh dist/meetrec dist
          rm dist/meetrec
          # 目標は単体 20MB 以下。universal は 2 アーキ分なので 40MB を上限にする。
          SIZE=$(stat -f %z dist/MeetRec.app/Contents/MacOS/meetrec)
          echo "binary size: $SIZE bytes (universal)"
          test "$SIZE" -lt 41943040

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release -p meetrec
          mkdir -p dist
          cp target/release/meetrec.exe dist/MeetRec.exe
          SIZE=$(stat -c %s dist/MeetRec.exe)
          echo "binary size: $SIZE bytes"
          test "$SIZE" -lt 20971520

      # インストーラ（Inno Setup）。ランナーに入っていなければ、版を固定して入れる。
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version=6.2.2 --no-progress -y
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          & $iscc "/DAppVersion=$version" packaging\windows\MeetRec.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist\MeetRec-setup.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: MeetRec-macos
          path: dist/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: MeetRec-windows
          path: |
            dist/MeetRec-setup.exe
            dist/MeetRec.exe
          if-no-files-found: error
