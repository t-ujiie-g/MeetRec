[workspace]
resolver = "2"
members = ["crates/core", "crates/platform-mac", "crates/platform-win", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.100"

[workspace.dependencies]
meetrec-core = { path = "crates/core" }
meetrec-mac = { path = "crates/platform-mac" }
meetrec-win = { path = "crates/platform-win" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
